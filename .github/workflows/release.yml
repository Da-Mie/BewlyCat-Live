name: Release

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Fork tag, for example v1.8.2-personal.1
        default: v1.8.2-personal.1
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_BRANCH: ${{ github.event.ref }}
      PUBLISH_RELEASE: ${{ github.event_name == 'create' }}
      PRERELEASE: ${{ github.event_name == 'create' || inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Verify release metadata
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, existsSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const releaseTag = process.env.RELEASE_TAG || process.env.RELEASE_BRANCH?.replace(/^release\//, '')
          const tag = /^v(\d+\.\d+\.\d+)-personal\.([1-9]\d*)$/.exec(releaseTag ?? '')
          if (!tag || tag[1] !== pkg.version)
            throw new Error('The fork tag base version must match package.json')
          if (pkg.homepage !== `https://github.com/${process.env.GITHUB_REPOSITORY}`)
            throw new Error('The package homepage must match this release repository')
          if (!existsSync(`docs/releases/${pkg.version}.md`))
            throw new Error('Release notes are missing')
          if (!existsSync('src/live/main.ts') || !existsSync('src/components/Settings/AccountLevelSettings.vue'))
            throw new Error('The tag does not contain the personal fork features')
          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          const refResponse = await fetch(`${api}/git/ref/tags/${encodeURIComponent(releaseTag)}`, { headers })
          if (refResponse.status !== 404) {
            if (!refResponse.ok)
              throw new Error(`Cannot verify the release tag: HTTP ${refResponse.status}`)
            let object = (await refResponse.json()).object
            for (let depth = 0; object?.type === 'tag' && depth < 4; depth++) {
              const response = await fetch(`${api}/git/tags/${object.sha}`, { headers })
              if (!response.ok)
                throw new Error(`Cannot resolve the release tag: HTTP ${response.status}`)
              object = (await response.json()).object
            }
            if (object?.type !== 'commit' || object.sha !== process.env.GITHUB_SHA)
              throw new Error('The existing tag must point to the selected workflow commit')
          }
          appendFileSync(process.env.GITHUB_ENV, `PACKAGE_VERSION=${pkg.version}\nRELEASE_TAG=${releaseTag}\n`)
          JS

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm build

      - name: Package extension and checksum
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          package = json.loads(Path('package.json').read_text())
          assert manifest['version'] == package['version']
          assert manifest['name'] == package['displayName']
          assert manifest['homepage_url'] == package['homepage']
          assert (root / 'dist/live/index.html').is_file()
          with zipfile.ZipFile('extension.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
              archive.write('LICENSE', 'LICENSE')
          digest = hashlib.sha256(Path('extension.zip').read_bytes()).hexdigest()
          Path('SHA256SUMS').write_text(f'{digest}  extension.zip\n')
          PY

      - name: Create GitHub release
        run: |
          release_options=(--draft)
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            release_options=()
          fi
          gh release create "$RELEASE_TAG" extension.zip SHA256SUMS \
            --target "$GITHUB_SHA" "${release_options[@]}" --prerelease="$PRERELEASE" \
            --title "BewlyCat Live $PACKAGE_VERSION" \
            --notes-file "docs/releases/$PACKAGE_VERSION.md"
